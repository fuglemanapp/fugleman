    <!-- Main F shape -->
    <path d="M 220,100 C 180,90 180,20 220,-30 L 320,-30 L 320,0 L 250,0 C 230,0 230,30 250,30 L 300,30 L 290,60 L 240,60 C 240,80 250,100 270,100 L 330,100 L 310,130 L 250,130 C 230,130 220,110 220,100 Z" fill="#0A1A44" />
    
    <!-- Right side Pills -->
    <!-- Green -->
    <g transform="translate(370, -60)">
      <rect width="100" height="30" rx="15" fill="#22C55E" />
      <rect x="25" y="15" width="6" height="8" rx="1" fill="white" />
      <rect x="40" y="10" width="6" height="13" rx="1" fill="white" />
      <rect x="55" y="5" width="6" height="18" rx="1" fill="white" />
    </g>
    
    <!-- Blue -->
    <g transform="translate(350, -15)">
      <rect width="120" height="30" rx="15" fill="#2563EB" />
      <rect x="35" y="6" width="20" height="16" rx="2" fill="none" stroke="white" stroke-width="2" />
      <rect x="40" y="3" width="3" height="6" rx="1" fill="white" />
      <rect x="48" y="3" width="3" height="6" rx="1" fill="white" />
      <line x1="35" y1="12" x2="55" y2="12" stroke="white" stroke-width="1.5" />
    </g>
    
    <!-- Purple -->
