  <!-- Text -->
  <text x="280" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="#0A1A44" text-anchor="middle" letter-spacing="-1">Fugleman</text>
