      <rect x="45" y="8" width="22" height="14" rx="2" fill="none" stroke="white" stroke-width="1.5" />
      <line x1="45" y1="13" x2="67" y2="13" stroke="white" stroke-width="3" />
      <rect x="48" y="17" width="6" height="2" rx="1" fill="white" />
